on:
  push:
  pull_request:

permissions: {}
jobs:
  setup:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - name: Set up AWS Emulator
        uses: $/

      - name: Verify AWS Emulator
        run: |
          aws sts get-caller-identity

  specific-version:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - name: Set up AWS Emulator
        uses: $/
        with:
          aws-emulator-version: "1.0.497"

      - name: Verify AWS Emulator
        run: |
          expected="1.0.497"
          output=$(aws-emulator --version)
          echo "$output"
          actual=$(echo "$output" | sed -n 's/^[[:space:]]*Version:[[:space:]]*//p' | head -n 1)
          if [ "$actual" = "$expected" ]; then
            echo "AWS Emulator version is correct"
          else
            echo "AWS Emulator version is incorrect: expected $expected, got $actual"
            exit 1
          fi

  auth-and-telemetry-off:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - name: Set up AWS Emulator
        uses: $/
        with:
          auth: "off"
          telemetry: "off"

      - name: Verify AWS Emulator
        run: |
          aws sts get-caller-identity
          grep -q "request authentication is off" "$RUNNER_TEMP/aws-emulator.log"
          grep -q "telemetry: disabled" "$RUNNER_TEMP/aws-emulator.log"
