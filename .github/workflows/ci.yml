on:
  push:
  pull_request:

jobs:
  setup:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
    steps:
      - name: Set up AWS Emulator
        uses: $/

      - name: Verify AWS Emulator
        run: |
          aws sts get-caller-identity

  specific-version:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Set up AWS Emulator
        uses: $/
        with:
          aws-emulator-version: "1.0.497"

      - name: Verify AWS Emulator
        run: |
          expected="1.0.497"
          output=$(aws-emulator --version)
          echo "$output"
          actual=$(echo "$output" | grep -oE '[0-9]+(\.[0-9]+)+' | head -n 1)
          if [ "$actual" = "$expected" ]; then
            echo "AWS Emulator version is correct"
          else
            echo "AWS Emulator version is incorrect: expected $expected, got $actual"
            exit 1
          fi
